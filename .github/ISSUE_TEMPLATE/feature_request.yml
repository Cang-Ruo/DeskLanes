name: 功能建议 (Feature Request)
description: 布局、交互、功能与体验改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请说明你想解决的实际问题，而不只是想要的功能——
        这样更容易判断优先级。当前路线以稳定性与兼容性为先，功能扩展会参考真实反馈。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      placeholder: "例如：分类多了以后找分类要点很多次"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你期望的方案
      placeholder: "描述你希望的行为或界面"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 全屏工作空间
        - 悬浮窗
        - 侧边栏
        - 悬浮球
        - 分类/自由分区
        - 搜索
        - 设置
        - 其它
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 补充
      description: 可选。是否有其它实现方式，或参考的软件
    validations:
      required: false
